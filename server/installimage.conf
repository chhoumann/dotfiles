# installimage config for a Hetzner dedicated server (2x NVMe, UEFI).
# Set HOSTNAME before use. Run: installimage -a -c installimage.conf
DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1
SWRAID 1
SWRAIDLEVEL 1
BOOTLOADER grub
HOSTNAME changeme
PART /boot/efi esp 256M
PART /boot ext4 1G
PART lvm vg0 all
LV vg0 root / xfs 40G
# Update to the image name shown in the installimage menu:
IMAGE /root/images/Ubuntu-2604-resolute-amd64-base.tar.zst
