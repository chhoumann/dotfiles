# Auto-restart services during upgrades, EXCEPT the ones that kill agent work:
# those wait for a manual maintenance window.
$nrconf{restart} = 'a';
$nrconf{override_rc} = {
    qr(^docker\.service$) => 0,
    qr(^containerd\.service$) => 0,
    qr(^tailscaled) => 0,
    qr(^vncserver@) => 0,
    qr(^novnc) => 0,
    # dbus restart tears down logind sessions and drops every SSH connection
    qr(^dbus) => 0,
};
