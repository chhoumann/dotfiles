# List services that need a restart after upgrades and restart none of them.
# Restarts happen by hand in a quiet window. The exclusions below still keep
# these services out of any manual `needrestart -r a` run.
$nrconf{restart} = 'l';
$nrconf{override_rc} = {
    qr(^docker\.service$) => 0,
    qr(^containerd\.service$) => 0,
    qr(^tailscaled) => 0,
    qr(^vncserver@) => 0,
    qr(^novnc) => 0,
    # dbus restart tears down logind sessions and drops every SSH connection
    qr(^dbus) => 0,
};
