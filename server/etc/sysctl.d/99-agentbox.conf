# Many parallel agents: each session + LSPs + watchers consumes watches and instances.
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024
fs.inotify.max_queued_events = 65536

# Byte-based dirty limits: avoid multi-second sync stalls from GBs of dirty pages
# (VDO write throughput is well below raw NVMe).
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 1073741824

# zram-as-primary-swap tuning.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0

# Tailscale recommended socket buffers.
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
